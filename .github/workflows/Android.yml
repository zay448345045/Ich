name: build

on:
#  push:
#    branches: [master]
#    tags: ["v*"]
#  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本号 (例如: v1.0.0)"
        required: true
        default: "v1.0.0"
      profile:
        description: "Reserved for manual trigger"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # info 级别不致命：仓库标准是 0 error/warning（见 README），
      # 否则依赖升级带进来的 deprecation 提示就会打断整条流水线。
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v3
#        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            
            **/*.apk
            **/*.zip
          generate_release_notes: true
